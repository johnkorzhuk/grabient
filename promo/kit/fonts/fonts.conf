<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The capture browser's fonts (env.sh sets FONTCONFIG_FILE for every script): the system's, with the site's "system
     stack" drawn in Inter, close to what a Mac or Windows reader sees where Linux would draw DejaVu Sans, and emoji in
     Noto Color Emoji (setup.sh fetches it). Nothing of the system's own font setup changes. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir prefix="xdg">grabient-promo-fonts</cachedir>
  <alias binding="strong"><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Inter</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="strong"><family>Sans</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <!-- Chrome on Linux names DejaVu Sans as its system font: Inter is drawn in its place -->
  <alias binding="strong"><family>DejaVu Sans</family><prefer><family>Inter</family></prefer></alias>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>
